[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/grpc_gen"]   # generated by scripts/gen_proto.py

[tool.coverage.run]
omit = ["app/grpc_gen/*"]
