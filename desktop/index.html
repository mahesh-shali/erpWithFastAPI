<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Platform</title>
    <!-- Loading screen styles live here (not in the CSS bundle) so the very first frame already shows it.
         The same screen is drawn by the update splash (electron/main/update-splash.ts) while the installer runs. -->
    <style>
      .splash-screen { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f5f7fb;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1d2330; }
      .splash-inner { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 16px; }
      .splash-logo { width: 72px; height: 72px; }
      .splash-title { margin: 6px 0 0; font-size: 20px; font-weight: 700; }
      .splash-message { margin: 0; font-size: 14px; color: #4b5563; }
      .splash-detail { margin: 0; font-size: 12.5px; color: #6b7280; }
      .splash-bar { position: relative; width: 220px; height: 4px; margin-top: 8px; border-radius: 4px; background: #e3e8f4; overflow: hidden; }
      .splash-bar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 4px; background: #2f5bea;
        animation: splash-slide 1.2s ease-in-out infinite; }
      @keyframes splash-slide { from { left: -40%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { .splash-bar::after { animation: none; left: 30%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-screen" role="status" aria-live="polite">
        <div class="splash-inner">
          <svg class="splash-logo" viewBox="0 0 1024 1024" aria-hidden="true">
            <defs><linearGradient id="splash-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2f5bea"/></linearGradient></defs>
            <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#splash-bg)"/>
            <g fill="#fff"><rect x="236" y="556" width="148" height="232" rx="36" fill-opacity=".72"/><rect x="438" y="420" width="148" height="368" rx="36" fill-opacity=".86"/><rect x="640" y="236" width="148" height="552" rx="36"/></g>
          </svg>
          <p class="splash-title">ERP Platform</p>
          <p class="splash-message">Loading…</p>
          <div class="splash-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
