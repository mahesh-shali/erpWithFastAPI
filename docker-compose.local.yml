# LOCAL environment: the full stack + observability on this machine. Layered on the base file:
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Easier: ./local.sh up   (PowerShell: bash ./local.sh up)
#
#   App (nginx)  http://localhost:8088        Grafana     http://localhost:3000
#   Postgres     localhost:5434               Prometheus  http://localhost:9090
#
# k6 runs as a one-off container (profile "loadtest") and streams its metrics into Prometheus, so a load
# test shows up live in Grafana next to API, Postgres, Redis and nginx metrics: ./local.sh load <profile>
# Host ports are bound to 127.0.0.1 only.

x-local-logging: &local-logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *local-logging
    ports: !override ["127.0.0.1:${LOCAL_PG_PORT:-5434}:5432"]
    command: >
      postgres -c max_connections=500 -c shared_buffers=512MB
               -c effective_cache_size=1536MB -c work_mem=8MB
               -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
               -c track_io_timing=on
               -c log_min_duration_statement=500

  redis:
    <<: *local-logging
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no

  migrator:
    environment:
      Jwt__AccessTokenMinutes: ${ACCESS_TOKEN_MINUTES:-15}

  api:
    <<: *local-logging
    environment:
      Metrics__Enabled: "true"
      RateLimit__PerUserPerSecond: ${RATE_LIMIT_PER_USER_PER_SECOND:-50}
      RateLimit__PerUserBurst: ${RATE_LIMIT_PER_USER_BURST:-100}
      RateLimit__AuthPerMinute: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      Jwt__AccessTokenMinutes: ${ACCESS_TOKEN_MINUTES:-15}
    healthcheck:
      # aspnet image has no curl; bash /dev/tcp is enough to know Kestrel is accepting
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      retries: 20

  ai-service:
    <<: *local-logging

  frontend:
    <<: *local-logging

  nginx:
    <<: *local-logging
    ports: !override ["127.0.0.1:${HTTP_PORT:-8088}:80"]
    volumes: !override
      - ./infra/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    sysctls:
      net.core.somaxconn: 65535

  # ---------------- observability ----------------
  prometheus:
    image: prom/prometheus:v2.54.1
    <<: *local-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # k6 pushes here (-o experimental-prometheus-rw)
      - --enable-feature=native-histograms
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    <<: *local-logging
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/erp-load-test.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    <<: *local-logging
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    <<: *local-logging
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    <<: *local-logging
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]

  # ---------------- load generator (one-off) ----------------
  k6:
    image: grafana/k6:0.54.0
    profiles: [loadtest]
    working_dir: /scripts
    volumes:
      - ./load-tests/k6:/scripts:ro
      - ./load-tests/results:/results
    environment:
      BASE_URL: http://nginx
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),avg,max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    depends_on: [nginx, prometheus]

  # Concurrent-connection soak: each replica holds CONNS keep-alive connections to nginx.
  # One replica per ~20k connections (source-port limit per IP):  ./local.sh conns 100000
  conn-soak:
    build: ./load-tests/conn-soak
    profiles: [loadtest]
    restart: "no"
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    environment:
      TARGET: ${SOAK_TARGET:-nginx:80}
      REQ_PATH: ${SOAK_PATH:-/health/live}
      CONNS: ${SOAK_CONNS_PER_REPLICA:-20000}
      RAMP: ${SOAK_RAMP:-1000}
      INTERVAL: ${SOAK_INTERVAL:-30}
      HOLD: ${SOAK_HOLD:-5m}
    depends_on: [nginx]

volumes:
  promdata:
  grafanadata:
