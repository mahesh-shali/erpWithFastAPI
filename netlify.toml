# Netlify: builds the React SPA and proxies /api and /ai to the backends, so the browser only ever
# talks to one origin (the HttpOnly, SameSite=Strict refresh cookie keeps working, no CORS needed).
#
# Required site environment variables (Site configuration > Environment variables):
#   API_ORIGIN = https://erp-api.onrender.com            (Render service URL, no trailing slash)
#   AI_ORIGIN  = https://<app>-<org>.koyeb.app           (Koyeb service URL, no trailing slash)
# The proxy rules are generated into dist/_redirects at build time (frontend/scripts/netlify-redirects.mjs).

[build]
  base = "frontend"
  command = "npm ci && npm run build && node scripts/netlify-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed assets can be cached forever; index.html must always be revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
