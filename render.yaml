# Render Blueprint: ASP.NET Core API (free web service, Docker).
# Render dashboard > New > Blueprint > pick this repo. Values marked `sync: false` are asked once
# during creation (paste them from your password manager / .env.production - never commit them).
#
# Deploys are triggered by GitHub Actions (.github/workflows/deploy.yml) AFTER database migrations,
# via the service's Deploy Hook, so auto-deploy on push is off.
services:
  - type: web
    name: erp-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                 # 512 MB, 0.1 CPU, sleeps after 15 min idle (keep-alive workflow pings it)
    region: singapore          # closest Render region to the Aiven database (Bengaluru)
    healthCheckPath: /health/live
    autoDeployTrigger: "off"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT                # Render routes traffic to this port; the Dockerfile listens on 8080
        value: "8080"
      - key: DOTNET_gcServer     # workstation GC: much smaller memory footprint on a 512 MB instance
        value: "0"
      - key: Proxy__ForwardLimit # browser -> Netlify -> Render: two proxies append X-Forwarded-For
        value: "2"
      - key: ConnectionStrings__Postgres
        sync: false              # Host=...;Port=20124;Database=erp_prod;Username=avnadmin;Password=...;SSL Mode=Require;Maximum Pool Size=3
      - key: ConnectionStrings__Redis
        value: ""                # empty = in-memory cache (fine for a single instance; saves Upstash quota)
      - key: JWT_SECRET
        sync: false              # same value as the AI service (Koyeb)
      - key: JWT_ISSUER
        value: erp-api
      - key: JWT_AUDIENCE
        value: erp-clients
      - key: Cors__Origins__0
        sync: false              # https://<your-site>.netlify.app
