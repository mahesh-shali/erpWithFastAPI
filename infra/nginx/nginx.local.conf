# LOCAL / load-test variant of nginx.conf (used by docker-compose.local.yml).
# Same routing as production; differences:
#   - per-IP rate limits raised: every k6 virtual user comes from one IP
#   - stub_status on :8081 (container network only) for nginx-prometheus-exporter
#   - upstreams re-resolved via Docker DNS so all API replicas get traffic after scale-up
worker_processes auto;
# Sized for ./local.sh conns 100000: each idle client keep-alive connection holds one slot.
worker_rlimit_nofile 262144;
events { worker_connections 65536; multi_accept on; }

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 75;   # > conn-soak's max request gap (1.5 x INTERVAL), so idle sockets are not reaped
  keepalive_requests 10000;
  gzip on;
  gzip_types application/json text/css application/javascript;
  access_log off;   # k6 + Prometheus give the numbers; logging every request costs CPU under load

  limit_req_zone $binary_remote_addr zone=api:20m rate=20000r/s;
  limit_req_zone $binary_remote_addr zone=ai:20m  rate=200r/s;

  resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS

  upstream api        { least_conn; server api:8080 resolve;        keepalive 256; zone upstream_api 64k; }
  upstream ai_service { least_conn; server ai-service:8000 resolve; keepalive 64;  zone upstream_ai 64k; }
  upstream frontend   { server frontend:80; }

  server {
    listen 80 backlog=65535 reuseport;   # reuseport spreads new connections evenly over workers
    client_max_body_size 1m;

    location /api/ {
      limit_req zone=api burst=20000 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/ {
      limit_req zone=ai burst=200 nodelay;
      proxy_pass http://ai_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 120s;
    }

    location /health/ {
      proxy_pass http://api;
      proxy_http_version 1.1;          # reuse pooled upstream connections (conn-soak hits this path)
      proxy_set_header Connection "";
    }

    location / { proxy_pass http://frontend; }
  }

  server {
    listen 8081;
    location /stub_status { stub_status; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 10.0.0.0/8; deny all; }
  }
}
