worker_processes auto;
events { worker_connections 8192; multi_accept on; }

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  gzip on;
  gzip_types application/json text/css application/javascript;

  # Edge rate limiting (per client IP). App-level per-user limits live in the services.
  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=ai:20m  rate=2r/s;

  upstream api        { least_conn; server api:8080;        keepalive 64; }
  upstream ai_service { least_conn; server ai-service:8000; keepalive 64; }
  upstream frontend   { server frontend:80; }

  server {
    listen 80;
    client_max_body_size 1m;

    location /api/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;   # https -> refresh cookie gets the Secure flag
    }

    location /ai/ {
      limit_req zone=ai burst=5 nodelay;
      proxy_pass http://ai_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;              # allow SSE streaming
      proxy_read_timeout 120s;
    }

    location / { proxy_pass http://frontend; }
  }
}
