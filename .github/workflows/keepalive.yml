name: Keep-alive

# Free Render web services sleep after 15 min idle and take about a minute to wake up.
# Pinging every 10 minutes keeps them awake during working hours only, because both backends share
# one pool of 750 free instance-hours a month. Using them up suspends every free service until the
# next month, and two services awake around the clock would need about 1,488 hours.
#
# Window: 03:00-13:59 UTC (08:30-19:30 IST), about 11 hours a day x 2 services x 31 days = 690 hours.
# Widening it past 12 hours a day exceeds the allowance.
#
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: '*/10 3-13 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and AI service
        env:
          API: ${{ vars.API_ORIGIN || 'https://erpwithfastapi-api.onrender.com' }}
          AI: ${{ vars.AI_ORIGIN || 'https://erpwithfastapi-ai.onrender.com' }}
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$API/health/live"; echo " api ok"
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$AI/ai/health"; echo " ai ok"
