name: Keep-alive

# Free Render (sleeps after 15 min idle) and Koyeb (after 1 h) instances take ~30-60 s to wake up,
# longer than Netlify's 26 s proxy timeout. Pinging them every 10 minutes keeps them warm.
# One always-on Render service uses ~730 of the 750 free instance-hours a month.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   API_ORIGIN  https://erp-api.onrender.com
#   AI_ORIGIN   https://<app>-<org>.koyeb.app
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and AI service
        env:
          API: ${{ vars.API_ORIGIN }}
          AI: ${{ vars.AI_ORIGIN }}
        run: |
          if [ -n "$API" ]; then curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$API/health/live"; echo " api ok"; fi
          if [ -n "$AI" ];  then curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$AI/ai/health"; echo " ai ok"; fi
