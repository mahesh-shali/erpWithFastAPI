name: Deploy (production)

# Order matters: database migrations first, then the new API / AI service versions.
#   1. Apply EF Core migrations to the production database (Aiven) - and, once, create the first SuperAdmin.
#   2. Trigger the Render deploy hooks (API and AI service).
# Render rebuilds the static frontend on its own after CI passes on main.
#
# Runs after CI succeeds on main, or manually (Actions > Deploy (production) > Run workflow).
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   PROD_PG_CONNECTION   Host=...;Port=20124;Database=erp_prod;Username=avnadmin;Password=...;SSL Mode=Require
#   PROD_JWT_SECRET      same value as on both Render backends
#   PROD_AI_DB_PASSWORD  password for the AI login role (same as in erpwithfastapi-ai's DATABASE_URL)
#   RENDER_DEPLOY_HOOK     erpwithfastapi-server > Settings > Deploy Hook URL
#   RENDER_DEPLOY_HOOK_AI  erpwithfastapi-ai > Settings > Deploy Hook URL
#   BOOTSTRAP_ORG_NAME / BOOTSTRAP_EMAIL / BOOTSTRAP_PASSWORD / BOOTSTRAP_FULL_NAME
#                        (optional, first deploy only) creates your organization + SuperAdmin; delete afterwards

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: deploy-production, cancel-in-progress: false }

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Apply database migrations (+ bootstrap owner if configured)
        run: dotnet run --project backend/src/Erp.Api -c Release -- --migrate
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Postgres: ${{ secrets.PROD_PG_CONNECTION }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          AI_DB_USER: erp_ai_ro_prod
          AI_DB_PASSWORD: ${{ secrets.PROD_AI_DB_PASSWORD }}
          Bootstrap__OrganizationName: ${{ secrets.BOOTSTRAP_ORG_NAME }}
          Bootstrap__Email: ${{ secrets.BOOTSTRAP_EMAIL }}
          Bootstrap__Password: ${{ secrets.BOOTSTRAP_PASSWORD }}
          Bootstrap__FullName: ${{ secrets.BOOTSTRAP_FULL_NAME }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy API (Render)
        env: { HOOK: '${{ secrets.RENDER_DEPLOY_HOOK }}' }
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
      - name: Deploy AI service (Render)
        env: { HOOK: '${{ secrets.RENDER_DEPLOY_HOOK_AI }}' }
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_AI not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render AI deploy triggered"
